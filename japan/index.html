<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .main-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .main-btn {
            padding: 20px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .main-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .main-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .hiragana-btn {
            background: #4CAF50;
            color: white;
        }
        
        .katakana-btn {
            background: #9E9E9E;
            color: white;
        }
        
        .katakana-btn.unlocked {
            background: #2196F3;
        }

        .vocab-btn {
            background: #9E9E9E;
            color: white;
        }
        
        .vocab-btn.unlocked {
            background: #E91E63;
        }
        
        .leaderboard-btn {
            background: #FF9800;
            color: white;
        }
        
        .stage-select, .game-screen, .leaderboard-screen {
            display: none;
        }
        
        .stage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .stage-btn {
            padding: 20px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            background: white;
            transition: all 0.3s;
        }
        
        .stage-btn:hover:not(:disabled) {
            background: #f0f0f0;
            border-color: #4CAF50;
        }
        
        .stage-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .stage-btn.completed {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        
        .back-btn {
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #666;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        
        .timer, .score {
            font-size: 24px;
            font-weight: bold;
        }
        
        .question {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .kana-display {
            font-size: 80px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .kana-display.vocab {
            font-size: 48px;
        }
        
        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .option-btn {
            padding: 30px;
            font-size: 24px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            background: white;
            transition: all 0.3s;
        }
        
        .option-btn:hover {
            background: #f0f0f0;
        }
        
        .option-btn.correct {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        
        .option-btn.wrong {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }
        
        .result-message {
            text-align: center;
            margin-top: 20px;
            font-size: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        
        .result-message.show {
            display: block;
        }
        
        .result-message.success {
            background: #4CAF50;
            color: white;
        }
        
        .result-message.fail {
            background: #f44336;
            color: white;
        }
        
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .leaderboard-table th,
        .leaderboard-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .leaderboard-table th {
            background: #4CAF50;
            color: white;
        }
        
        .leaderboard-table tr:hover {
            background: #f5f5f5;
        }
        
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: background 0.3s ease;
        }
        .modal-backdrop.show {
            display: flex;
            background: rgba(0,0,0,0.5);
        }
        .modal {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transform: scale(0.8) translateY(20px);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
        }
        .modal-backdrop.show .modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        .modal h3 {
            margin-bottom: 10px;
        }
        .modal .actions {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .modal .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        .modal .btn-primary {
            background: #4CAF50;
            color: #fff;
        }
        .modal .btn-secondary {
            background: #666;
            color: #fff;
        }
        .hidden {
            display: none !important;
        }
        
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1000;
        }
        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 14px;
            opacity: 0.9;
            animation: confetti-fall 1.8s linear forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(540deg); }
        }

        /* 複習畫面 */
        .review-screen {
            display: none;
            animation: fadeSlideIn 0.4s ease both;
        }
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .review-section-title {
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0 10px;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .review-section-title.wrong {
            background: #f44336;
            color: #fff;
        }
        .review-section-title.slow {
            background: #ff9800;
            color: #fff;
        }
        .review-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .review-card {
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            transition: transform 0.2s;
            animation: cardPop 0.3s ease both;
        }
        @keyframes cardPop {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .review-card:hover {
            transform: scale(1.05);
        }
        .review-card.wrong {
            background: #ffebee;
            border: 2px solid #f44336;
        }
        .review-card.slow {
            background: #fff8e1;
            border: 2px solid #ffca28;
        }
        .review-card .kana {
            font-size: 42px;
            font-weight: bold;
        }
        .review-card.wrong .kana {
            color: #d32f2f;
        }
        .review-card.slow .kana {
            color: #f57f17;
        }
        .review-card .romaji {
            font-size: 18px;
            color: #555;
            margin-top: 4px;
        }
        .review-card .detail {
            font-size: 13px;
            color: #999;
            margin-top: 4px;
        }
        .review-continue-btn {
            display: block;
            margin: 24px auto 0;
            padding: 14px 40px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #4CAF50;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        .review-continue-btn:hover {
            background: #388E3C;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日文學習 - 五十音挑戰</h1>
        
        <!-- 主選單 -->
        <div class="main-menu" id="mainMenu">
            <button class="main-btn hiragana-btn" onclick="openStageSelect(1)">第一大關 - 平假名挑戰</button>
            <button class="main-btn katakana-btn" id="katakanaBtn" onclick="openStageSelect(2)" disabled>第二大關 - 片假名挑戰</button>
            <button class="main-btn vocab-btn" id="vocabBtn" onclick="openStageSelect(3)" disabled>第三大關 - 單詞挑戰</button>
            <button class="main-btn leaderboard-btn" onclick="showLeaderboard()">排行榜</button>
        </div>
        
        <!-- 關卡選擇 -->
        <div class="stage-select" id="stageSelect">
            <button class="back-btn" onclick="backToMain()">返回主選單</button>
            <h2 id="stageSelectTitle">選擇小關卡</h2>
            <div class="stage-grid" id="stageGrid"></div>
        </div>
        
        <!-- 遊戲畫面 -->
        <div class="game-screen" id="gameScreen">
            <button class="back-btn" onclick="backToStageSelect()">返回關卡選擇</button>
            <div class="game-header">
                <div class="timer">時間: <span id="timer">0</span>s</div>
                <div class="score">正確: <span id="correct">0</span>/<span id="total">0</span></div>
            </div>
            <div class="question">
                <div class="kana-display" id="kanaDisplay">あ</div>
            </div>
            <div class="options" id="options"></div>
            <div class="result-message" id="resultMessage"></div>
        </div>

        <!-- 複習畫面 -->
        <div class="review-screen" id="reviewScreen">
            <h2>📖 複習一下吧！</h2>
            <div id="reviewContent"></div>
            <button class="review-continue-btn" id="reviewContinueBtn">繼續</button>
        </div>
        
        <!-- 排行榜 -->
        <div class="leaderboard-screen" id="leaderboardScreen">
            <button class="back-btn" onclick="backToMain()">返回主選單</button>
            <h2>排行榜 - 最速通關紀錄</h2>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>大關</th>
                        <th>小關</th>
                        <th>最速時間</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>

        <!-- 失敗彈窗 -->
        <div class="modal-backdrop" id="failModal">
            <div class="modal">
                <h3 id="failTitle">提示</h3>
                <div id="failMessage"></div>
                <div class="actions">
                    <button class="btn btn-primary" id="retryBtn">確定</button>
                    <button class="btn btn-secondary" id="backBtn">返回關卡選擇</button>
                </div>
            </div>
        </div>

        <!-- 成功彈窗 -->
        <div class="modal-backdrop" id="successModal">
            <div class="modal">
                <h3 id="successTitle">恭喜挑戰成功！</h3>
                <div id="successMessage"></div>
                <div class="actions">
                    <button class="btn btn-primary" id="successHomeBtn">回到首頁</button>
                    <button class="btn btn-secondary" id="successStageBtn">回到關卡選擇</button>
                </div>
            </div>
        </div>
    </div>

        let currentBigStage = 1;
        let currentSmallStage = 1;
        let currentQuestionIndex = 0;
        let correctAnswers = 0;
        let totalQuestions = 0;
        let timer = 0;
        let timerInterval = null;
        let questions = [];
        let isAnswering = false;
        let gameEnded = false;

        // 複習追蹤
        let wrongAnswers = [];      // { char, romaji, hiragana, yourAnswer }
        let slowAnswers = [];       // { char, romaji, hiragana, time }
        let questionStartTime = 0;  // 每題開始時間戳

        // ========== 彩窗函式 ==========
        function showModal({ title, messageHtml, primaryText, secondaryText, onPrimary, onSecondary, lockGame }) {
            if (lockGame) {
                clearInterval(timerInterval);
                gameEnded = true;
            }
            document.getElementById('failTitle').textContent = title || '提示';
            document.getElementById('failMessage').innerHTML = messageHtml || '';

            const primaryBtn = document.getElementById('retryBtn');
            const secondaryBtn = document.getElementById('backBtn');

            primaryBtn.textContent = primaryText || '確定';
            primaryBtn.onclick = onPrimary || (() => hideModal());

            if (secondaryText) {
                secondaryBtn.textContent = secondaryText;
                secondaryBtn.classList.remove('hidden');
                secondaryBtn.onclick = onSecondary || (() => hideModal());
            } else {
                secondaryBtn.classList.add('hidden');
            }

            document.getElementById('failModal').classList.add('show');
        }

        function hideModal() {
            document.getElementById('failModal').classList.remove('show');
        }

        function showSuccessModal({ time, accuracy, unlockedNext }) {
            triggerConfetti();

            const msgParts = [
                `🎉 太棒了！`,
                `用時：${time}秒`,
                `正確率：${accuracy}%`,
                unlockedNext ? '🔓 已解鎖新關卡！' : ''
            ].filter(Boolean);

            document.getElementById('successMessage').innerHTML = msgParts.join('<br>');
            document.getElementById('successModal').classList.add('show');

            document.getElementById('successHomeBtn').onclick = () => {
                hideSuccessModal();
                backToMain();
            };
            document.getElementById('successStageBtn').onclick = () => {
                hideSuccessModal();
                backToStageSelect();
            };
        }

        function hideSuccessModal() {
            document.getElementById('successModal').classList.remove('show');
            clearConfetti();
        }

        function triggerConfetti() {
            const container = document.getElementById('confetti');
            clearConfetti();

            const colors = ['#ff5252', '#ff9800', '#ffeb3b', '#4caf50', '#2196f3', '#9c27b0'];
            const count = 80;

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = (Math.random() * 0.3) + 's';
                container.appendChild(piece);
            }

            setTimeout(clearConfetti, 2500);
        }

        function clearConfetti() {
            document.getElementById('confetti').innerHTML = '';
        }
        // ========== 彩窗函式結束 ==========
        
        // 初始化
        function init() {
            checkKatakanaUnlock();
            checkVocabUnlock();
        }
        
        // 檢查第二大關是否解鎖
        function checkKatakanaUnlock() {
            let allCompleted = true;
            for (let i = 1; i <= 10; i++) {
                const record = localStorage.getItem(`stage_1_${i}`);
                if (!record) {
                    allCompleted = false;
                    break;
                }
            }
            const btn = document.getElementById('katakanaBtn');
            btn.disabled = !allCompleted;
            btn.classList.toggle('unlocked', allCompleted);
        }

        // 檢查第三大關是否解鎖
        function checkVocabUnlock() {
            let allCompleted = true;
            for (let i = 1; i <= 10; i++) {
                const record = localStorage.getItem(`stage_2_${i}`);
                if (!record) {
                    allCompleted = false;
                    break;
                }
            }
            const btn = document.getElementById('vocabBtn');
            btn.disabled = !allCompleted;
            btn.classList.toggle('unlocked', allCompleted);
        }
        
        // 打開關卡選擇
        function openStageSelect(bigStage) {
            currentBigStage = bigStage;
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('stageSelect').style.display = 'block';
            
            const titles = {
                1: '平假名挑戰 - 選擇小關卡',
                2: '片假名挑戰 - 選擇小關卡',
                3: '單詞挑戰 - 選擇小關卡'
            };
            document.getElementById('stageSelectTitle').textContent = titles[bigStage];
            
            renderStageGrid();
        }
        
        // 取得大關的小關數量
        function getSubStageCount() {
            return currentBigStage === 3 ? 19 : 10;
        }

        // 取得小關的題目數量
        function getKanaCount(smallStage) {
            if (currentBigStage === 3) {
                // 第三大關：第1關10題，之後每關+5題
                return 10 + (smallStage - 1) * 5;
            }
            return 15 + (smallStage - 1) * 5;
        }

        // 渲染關卡網格
        function renderStageGrid() {
            const grid = document.getElementById('stageGrid');
            grid.innerHTML = '';
            
            const subStageCount = getSubStageCount();

            for (let i = 1; i <= subStageCount; i++) {
                const btn = document.createElement('button');
                btn.className = 'stage-btn';
                
                const kanaCount = getKanaCount(i);
                const timeLimit = kanaCount * 2;
                const record = localStorage.getItem(`stage_${currentBigStage}_${i}`);

                const label = currentBigStage === 3 ? `${kanaCount}個單詞` : `${kanaCount}個假名`;
                btn.innerHTML = `小關 ${i}<br>${label}<br>限時 ${timeLimit}秒`;
                
                if (record) {
                    btn.classList.add('completed');
                    btn.innerHTML += `<br>✓ ${record}秒`;
                }
                
                // 檢查是否解鎖
                if (i === 1 || localStorage.getItem(`stage_${currentBigStage}_${i-1}`)) {
                    btn.onclick = () => startGame(i);
                } else {
                    btn.disabled = true;
                }
                
                grid.appendChild(btn);
            }
        }
        
        // 開始遊戲
        function startGame(smallStage) {
            currentSmallStage = smallStage;
            currentQuestionIndex = 0;
            correctAnswers = 0;
            timer = 0;
            gameEnded = false;
            wrongAnswers = [];
            slowAnswers = [];
            questionStartTime = 0;
            hideFailModal();
            hideSuccessModal();
            
            document.getElementById('stageSelect').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('reviewScreen').style.display = 'none';
            
            // 生成題目
            generateQuestions();
            
            totalQuestions = questions.length;
            document.getElementById('total').textContent = totalQuestions;
            document.getElementById('correct').textContent = correctAnswers;
            
            // 開始計時
            startTimer();
            
            // 顯示第一題
            showQuestion();
        }

        // 生成題目
        function generateQuestions() {
            const kanaCount = getKanaCount(currentSmallStage);

            if (currentBigStage === 3) {
                // 單詞關卡
                const availableVocab = vocabData.slice(0, kanaCount);
                questions = [];
                availableVocab.forEach(v => questions.push({...v}));
                while (questions.length < kanaCount) {
                    const rv = availableVocab[Math.floor(Math.random() * availableVocab.length)];
                    questions.push({...rv});
                }
                shuffleArray(questions);
                return;
            }

            const data = currentBigStage === 1 ? hiraganaData : katakanaData;
            const availableKana = data.slice(0, kanaCount);
            
            questions = [];
            availableKana.forEach(kana => {
                questions.push({...kana});
            });
            while (questions.length < kanaCount) {
                const randomKana = availableKana[Math.floor(Math.random() * availableKana.length)];
                questions.push({...randomKana});
            }
            shuffleArray(questions);
        }
        
        // 顯示題目
        function showQuestion() {
            if (currentQuestionIndex >= questions.length) {
                endGame(true);
                return;
            }
            
            isAnswering = true;
            questionStartTime = Date.now();
            const question = questions[currentQuestionIndex];
            const display = document.getElementById('kanaDisplay');
            display.textContent = currentBigStage === 3 ? question.word : question.char;
            display.classList.toggle('vocab', currentBigStage === 3);
            document.getElementById('resultMessage').classList.remove('show');
            
            // 生成選項
            if (currentBigStage === 3) {
                generateVocabOptions(question);
            } else {
                generateOptions(question);
            }
        }
        
        // 生成選項
        function generateOptions(correctQuestion) {
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            const data = currentBigStage === 1 ? hiraganaData : katakanaData;
            const options = [correctQuestion];
            
            // 對於片假名，隨機決定選項類型（平假名或羅馬拼音）
            const useHiragana = currentBigStage === 2 && Math.random() > 0.5;
            
            // 生成3個錯誤選項
            while (options.length < 4) {
                const randomKana = data[Math.floor(Math.random() * data.length)];
                if (randomKana.romaji !== correctQuestion.romaji) {
                    options.push(randomKana);
                }
            }
            
            shuffleArray(options);
            
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                
                if (currentBigStage === 1) {
                    btn.textContent = option.romaji;
                } else {
                    btn.textContent = useHiragana ? option.hiragana : option.romaji;
                }
                
                btn.onclick = () => checkAnswer(option, correctQuestion, btn);
                optionsDiv.appendChild(btn);
            });
        }

        // 生成單詞選項（中文意思）
        function generateVocabOptions(correctQuestion) {
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';

            // 收集所有可用的中文意思（排除正確答案）
            const allMeanings = vocabData
                .map(v => v.meaning)
                .filter(m => m !== correctQuestion.meaning);
            const allDecoys = [...allMeanings, ...decoyMeanings];

            // 隨機挑3個不重複的錯誤選項
            const wrongOptions = [];
            const usedSet = new Set([correctQuestion.meaning]);
            while (wrongOptions.length < 3) {
                const pick = allDecoys[Math.floor(Math.random() * allDecoys.length)];
                if (!usedSet.has(pick)) {
                    usedSet.add(pick);
                    wrongOptions.push(pick);
                }
            }

            const options = [
                { meaning: correctQuestion.meaning, isCorrect: true },
                ...wrongOptions.map(m => ({ meaning: m, isCorrect: false }))
            ];
            shuffleArray(options);

            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option.meaning;
                btn.onclick = () => checkVocabAnswer(option, correctQuestion, btn);
                optionsDiv.appendChild(btn);
            });
        }

        // 檢查單詞答案
        function checkVocabAnswer(selected, correct, btn) {
            if (!isAnswering || gameEnded) return;
            isAnswering = false;

            const responseTime = (Date.now() - questionStartTime) / 1000;

            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach(b => b.style.pointerEvents = 'none');

            if (selected.meaning === correct.meaning) {
                btn.classList.add('correct');
                correctAnswers++;
                document.getElementById('correct').textContent = correctAnswers;

                // 播放正確答案的日語發音（正常速度）
                playJapanesePronunciation(correct.word, true);

                if (responseTime > 2) {
                    slowAnswers.push({
                        char: correct.word,
                        romaji: correct.meaning,
                        hiragana: '',
                        time: responseTime.toFixed(1)
                    });
                }

                setTimeout(() => {
                    currentQuestionIndex++;
                    showQuestion();
                    optionBtns.forEach(b => b.style.pointerEvents = 'auto');
                }, 500);
            } else {
                btn.classList.add('wrong');

                wrongAnswers.push({
                    char: correct.char,
                    romaji: correct.romaji,
                    hiragana: correct.hiragana || '',
                    yourAnswer: selected.meaning
                });

                optionBtns.forEach(b => {
                    if (b.textContent === correct.meaning) b.classList.add('correct');
                });

                showModal({
                    title: '答錯了',
                    messageHtml: `<strong>${correct.word}</strong> 的意思是：<strong>${correct.meaning}</strong>`,
                    primaryText: '繼續',
                    secondaryText: null,
                    lockGame: false,
                    onPrimary: () => {
                        hideModal();
                        // 點擊確認時再播放一次發音（放慢速度）
                        playJapanesePronunciation(correct.word, false);
                        currentQuestionIndex++;
                        showQuestion();
                        optionBtns.forEach(b => b.style.pointerEvents = 'auto');
                    }
                });

                // 播放正確答案的日語發音（放慢速度）
                playJapanesePronunciation(correct.word, false);
            }
        }

        // 檢查答案
        function checkAnswer(selected, correct, btn) {
            if (!isAnswering || gameEnded) return;
            isAnswering = false;

            const responseTime = (Date.now() - questionStartTime) / 1000;

            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach(b => b.style.pointerEvents = 'none');

            if (selected.romaji === correct.romaji) {
                // 正確
                btn.classList.add('correct');
                correctAnswers++;
                document.getElementById('correct').textContent = correctAnswers;

                // 播放正確答案的日語發音（正常速度）
                playJapanesePronunciation(correct.char, true);

                // 追蹤慢答題（正確但超過2秒）
                if (responseTime > 2) {
                    slowAnswers.push({
                        char: correct.char,
                        romaji: correct.romaji,
                        hiragana: correct.hiragana || '',
                        time: responseTime.toFixed(1)
                    });
                }
                
                setTimeout(() => {
                    currentQuestionIndex++;
                    showQuestion();
                    optionBtns.forEach(b => b.style.pointerEvents = 'auto');
                }, 500);
            } else {
                // 答錯
                btn.classList.add('wrong');

                // 追蹤錯誤答案
                wrongAnswers.push({
                    char: correct.char,
                    romaji: correct.romaji,
                    hiragana: correct.hiragana || '',
                    yourAnswer: selected.romaji
                });

                optionBtns.forEach(b => {
                    const btnText = b.textContent;
                    if (currentBigStage === 1) {
                        if (btnText === correct.romaji) b.classList.add('correct');
                    } else {
                        if (btnText === correct.romaji || btnText === correct.hiragana) b.classList.add('correct');
                    }
                });

                showModal({
                    title: '答錯了',
                    messageHtml: `正確答案是：${correct.romaji}`,
                    primaryText: '繼續',
                    secondaryText: null,
                    lockGame: false,
                    onPrimary: () => {
                        hideModal();
                        // 點擊確認時再播放一次發音（放慢速度）
                        playJapanesePronunciation(correct.char, false);
                        currentQuestionIndex++;
                        showQuestion();
                        optionBtns.forEach(b => b.style.pointerEvents = 'auto');
                    }
                });

                // 播放正確答案的日語發音（放慢速度）
                // playJapanesePronunciation(correct.char, false);
            }
        }

        // 播放日語發音
        function playJapanesePronunciation(text, isCorrect = true) {
            // 使用 Web Speech API 播放日語發音
            if ('speechSynthesis' in window) {
                // 停止之前的播放
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';  // 設定為日語
                utterance.rate = isCorrect ? 1.0 : 0.7;  // 答對正常速度，答錯放慢
                utterance.pitch = 1;
                utterance.volume = 1;
                
                window.speechSynthesis.speak(utterance);
            }
        }

        // 開始計時
        function startTimer() {
            const kanaCount = getKanaCount(currentSmallStage);
            const timeLimit = kanaCount * 2;
            
            timerInterval = setInterval(() => {
                if (gameEnded) return;
                timer++;
                document.getElementById('timer').textContent = timer;

                if (timer >= timeLimit) {
                    endGame(false);
                }
            }, 1000);
        }
        
        // 結束遊戲
        function endGame(success) {
            if (gameEnded) return;
            clearInterval(timerInterval);
            gameEnded = true;
            
            const kanaCount = getKanaCount(currentSmallStage);
            const timeLimit = kanaCount * 2;
            const accuracy = (correctAnswers / totalQuestions * 100).toFixed(0);
            
            if (success && correctAnswers === totalQuestions && timer < timeLimit) {
                // 挑戰成功 — 不需要複習
                const key = `stage_${currentBigStage}_${currentSmallStage}`;
                const oldRecord = localStorage.getItem(key);

                if (!oldRecord || timer < parseInt(oldRecord)) {
                    localStorage.setItem(key, timer.toString());
                }

                const hasNext = currentSmallStage < 10;
                const nextKey = `stage_${currentBigStage}_${currentSmallStage + 1}`;
                const nextWasLocked = hasNext && !localStorage.getItem(nextKey);

                showSuccessModal({
                    time: timer,
                    accuracy,
                    unlockedNext: nextWasLocked
                });

                checkKatakanaUnlock();
                checkVocabUnlock();
            } else {
                // 挑戰失敗
                let reason = '';
                if (correctAnswers !== totalQuestions) {
                    reason = `正確率未達100% (${accuracy}%)`;
                } else if (timer >= timeLimit) {
                    reason = '超過時間限制';
                }

                const failMsg = `${reason}<br>用時：${timer}秒 / ${timeLimit}秒<br>正確率：${accuracy}%`;

                // 去重慢答題（排除已在錯誤列表中的）
                const wrongChars = new Set(wrongAnswers.map(w => w.char));
                const uniqueSlowAnswers = slowAnswers.filter(s => !wrongChars.has(s.char));

                if (wrongAnswers.length > 0) {
                    // 有錯誤，先彈出提示窗，確定後再進入複習畫面
                    showModal({
                        title: '⏰ 挑戰結束',
                        messageHtml: `${reason}<br>用時：${timer}秒 / ${timeLimit}秒<br>正確率：${accuracy}%<br><br>接下來複習一下答錯的假名吧！`,
                        primaryText: '開始複習',
                        secondaryText: null,
                        lockGame: false,
                        onPrimary: () => {
                            hideModal();
                            setTimeout(() => {
                                showReviewScreen(wrongAnswers, uniqueSlowAnswers, failMsg);
                            }, 300);
                        }
                    });
                } else {
                    // 沒有答錯（純粹超時），直接顯示失敗彈窗
                    showFailModal(failMsg);
                }
            }
        }

        // 顯示複習畫面
        function showReviewScreen(wrongs, slows, failMsg) {
            document.getElementById('gameScreen').style.display = 'none';
            const reviewEl = document.getElementById('reviewScreen');
            reviewEl.style.display = 'none';
            void reviewEl.offsetWidth;
            reviewEl.style.display = 'block';

            const content = document.getElementById('reviewContent');
            content.innerHTML = '';

            const isVocab = currentBigStage === 3;
            const wrongLabel = isVocab ? '答錯的單詞' : '答錯的假名';
            const slowLabel = isVocab ? '反應較慢的單詞' : '反應較慢的假名';

            if (wrongs.length > 0) {
                const wrongTitle = document.createElement('div');
                wrongTitle.className = 'review-section-title wrong';
                wrongTitle.textContent = `❌ ${wrongLabel}（${wrongs.length}個）`;
                content.appendChild(wrongTitle);

                const wrongGrid = document.createElement('div');
                wrongGrid.className = 'review-grid';

                wrongs.forEach((item, idx) => {
                    const card = document.createElement('div');
                    card.className = 'review-card wrong';
                    card.style.animationDelay = (idx * 0.07) + 's';
                    card.style.cursor = 'pointer';
                    
                    if (isVocab) {
                        card.innerHTML = `
                            <div class="kana">${item.char}</div>
                            <div class="romaji">${item.romaji}</div>
                            <div class="detail">你選了：${item.yourAnswer}</div>
                        `;
                    } else {
                        card.innerHTML = `
                            <div class="kana">${item.char}</div>
                            <div class="romaji">${item.romaji}</div>
                            <div class="detail">你選了：${item.yourAnswer}</div>
                        `;
                    }
                    
                    // 點擊卡片播放發音（放慢速度）
                    card.onclick = () => playJapanesePronunciation(item.char, false);
                    
                    wrongGrid.appendChild(card);
                });

                content.appendChild(wrongGrid);
            }

            if (slows.length > 0) {
                const slowTitle = document.createElement('div');
                slowTitle.className = 'review-section-title slow';
                slowTitle.textContent = `⏱ ${slowLabel}（${slows.length}個，超過2秒）`;
                content.appendChild(slowTitle);

                const slowGrid = document.createElement('div');
                slowGrid.className = 'review-grid';

                const baseDelay = wrongs.length * 0.07;
                slows.forEach((item, idx) => {
                    const card = document.createElement('div');
                    card.className = 'review-card slow';
                    card.style.animationDelay = (baseDelay + idx * 0.07) + 's';
                    card.style.cursor = 'pointer';
                    
                    card.innerHTML = `
                        <div class="kana">${item.char}</div>
                        <div class="romaji">${item.romaji}</div>
                        <div class="detail">用時：${item.time}秒</div>
                    `;
                    
                    // 點擊卡片播放發音（放慢速度）
                    card.onclick = () => playJapanesePronunciation(item.char, false);
                    
                    slowGrid.appendChild(card);
                });

                content.appendChild(slowGrid);
            }

            document.getElementById('reviewContinueBtn').onclick = () => {
                document.getElementById('reviewScreen').style.display = 'none';
                setTimeout(() => {
                    showFailModal(failMsg);
                }, 200);
            };
        }
        
        // 失敗彈窗
        function showFailModal(messageHtml) {
            showModal({
                title: '挑戰失敗！',
                messageHtml,
                primaryText: '重新挑戰',
                secondaryText: '返回關卡選擇',
                lockGame: true,
                onPrimary: () => {
                    hideModal();
                    startGame(currentSmallStage);
                },
                onSecondary: () => {
                    hideModal();
                    backToStageSelect();
                }
            });
        }

        // 隱藏失敗彈窗
        function hideFailModal() {
            document.getElementById('failModal').classList.remove('show');
        }

        // 返回關卡選擇
        function backToStageSelect() {
            clearInterval(timerInterval);
            gameEnded = false;
            hideSuccessModal();
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('reviewScreen').style.display = 'none';
            document.getElementById('stageSelect').style.display = 'block';
            renderStageGrid();
        }
        
        // 返回主選單
        function backToMain() {
            hideSuccessModal();
            document.getElementById('stageSelect').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('reviewScreen').style.display = 'none';
            document.getElementById('leaderboardScreen').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'flex';
            checkKatakanaUnlock();
        }
        
        // 顯示排行榜
        function showLeaderboard() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('leaderboardScreen').style.display = 'block';
            
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';

            const stageNames = { 1: '平假名', 2: '片假名', 3: '單詞' };
            const stageCounts = { 1: 10, 2: 10, 3: 19 };
            
            for (let bigStage = 1; bigStage <= 3; bigStage++) {
                for (let smallStage = 1; smallStage <= stageCounts[bigStage]; smallStage++) {
                    const record = localStorage.getItem(`stage_${bigStage}_${smallStage}`);
                    if (record) {
                        const row = tbody.insertRow();
                        row.insertCell(0).textContent = stageNames[bigStage];
                        row.insertCell(1).textContent = `小關 ${smallStage}`;
                        row.insertCell(2).textContent = `${record} 秒`;
                    }
                }
            }
            
            if (tbody.rows.length === 0) {
                const row = tbody.insertRow();
                const cell = row.insertCell(0);
                cell.colSpan = 3;
                cell.textContent = '尚無紀錄';
                cell.style.textAlign = 'center';
            }
        }
        
        // 工具函數：打亂陣列
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        // 頁面載入時初始化
        init();
    </script>
</body>
</html>
